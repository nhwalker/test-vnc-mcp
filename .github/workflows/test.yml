name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # ubuntu-latest ships Docker, which the end-to-end test needs to build and
    # run the Xvfb + x11vnc desktop it drives.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:e2e
